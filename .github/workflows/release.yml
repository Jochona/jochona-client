name: Release
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v)'
        required: true
        default: '0.0.0-dev'
      publish:
        description: 'Create a GitHub Release (false = dry run, artifacts only)'
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.vars.outputs.ci_version }}
      release_version: ${{ steps.vars.outputs.release_version }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
    steps:
      - name: Compute version
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          RELEASE_VERSION="${TAG#v}"
          CI_VERSION=$(echo "${GITHUB_SHA}" | cut -c1-6)
          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      release_version: ${{ needs.setup.outputs.release_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}
      release_version: ${{ needs.setup.outputs.release_version }}

  publish:
    needs: [setup, build-appimage, build-windows-macos]
    if: ${{ github.event_name == 'push' || inputs.publish == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/Jochona-LinuxAppImage-*/*.AppImage release/
          cp artifacts/Jochona-macOS-*/*.dmg release/
          ( cd artifacts/Jochona-Windows-x64-*/ && zip -r -X "${GITHUB_WORKSPACE}/release/Jochona-Windows-x64-${{ needs.setup.outputs.tag_name }}.zip" . )
          cd release && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          name: ${{ needs.setup.outputs.tag_name }}
          files: release/*
          body: |
            Jochona ${{ needs.setup.outputs.tag_name }}

            **These builds are unsigned.** No code-signing certificate is wired into CI for
            Windows (signtool) or macOS (codesign/notarization) — the SIGNTOOL_PARAMS
            thumbprint and SIGNING_IDENTITY referenced by the build scripts are never set by
            any CI secret, so binaries are produced without a certificate. Expect
            SmartScreen/Gatekeeper warnings on first run.

            SHA256SUMS is included for integrity verification.
