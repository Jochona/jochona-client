# Jochona: triggers trimmed to PR + manual dispatch (see docs/github-setup.md). Re-adding push triggers requires minute-budget review (Free-plan macOS = 10x).
---
name: Build
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ci_version: ${{ steps.set-ci-version.outputs.ci_version }}
    steps:
      - name: Set CI version
        id: set-ci-version
        shell: bash
        run: |
          CI_VERSION=`echo ${GITHUB_SHA} | cut -c1-6`
          echo "ci_version=${CI_VERSION}" >> "${GITHUB_OUTPUT}"

  build-appimage:
    needs: setup
    uses: ./.github/workflows/build-appimage.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-steamlink:
    needs: setup
    uses: ./.github/workflows/build-steamlink.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  build-windows-macos:
    needs: setup
    uses: ./.github/workflows/build-win-mac.yml
    with:
      ci_version: ${{ needs.setup.outputs.ci_version }}

  # Linguist extraction enforcement (proposal §6: every UI string extractable).
  # Runs lupdate against the declared TRANSLATIONS; a dirty languages/ tree
  # means someone added/changed a qsTr string without committing regenerated
  # .ts files. Fix locally:  lupdate -project app/app.pro  &&  commit app/languages/
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: 'qttools'
      - name: Extract UI strings
        working-directory: app
        run: lupdate app.pro
      - name: Require committed translations
        run: git diff --exit-code -- app/languages/ || (echo "::error::app/languages/*.ts stale — run 'lupdate -project app/app.pro' and commit the result"; exit 1)
