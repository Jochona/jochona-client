# Jochona: on-demand Linguist regeneration. The Build workflow's i18n job
# fails when app/languages/*.ts drift from the qsTr strings in the tree.
# Dispatch this from a PR branch to regenerate and commit the .ts files
# without needing a local Qt install. Untranslated new strings keep their
# English source text at runtime (Qt falls back to the source string).
---
name: Regenerate translations
permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: 'qttools'
      - name: Extract UI strings
        working-directory: app
        run: lupdate app.pro
      - name: Commit regenerated translations
        run: |
          if git diff --quiet -- app/languages/; then
            echo "translations already current"
            exit 0
          fi
          git config user.name "jochona-ci"
          git config user.email "ci@jochona.invalid"
          git commit -m "Regenerate translation sources (lupdate)"
          git push origin HEAD:${{ github.ref_name }}
